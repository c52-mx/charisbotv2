<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200">
  <title>Charis — Logotipo completo</title>

  <!-- ══ VARIANTE PRINCIPAL: fondo claro ══ -->
  <!-- Case trasera -->
  <g transform="translate(20, 20)">
    <rect x="28" y="0" width="56" height="78" rx="13" fill="none" stroke="#4baef0" stroke-width="3.5"/>
    <rect x="43" y="4" width="18" height="4.5" rx="2.25" fill="#4baef0" opacity="0.65"/>
    <rect x="24.5" y="22" width="3.5" height="12" rx="1.75" fill="#4baef0" opacity="0.55"/>
    <rect x="24.5" y="37" width="3.5" height="12" rx="1.75" fill="#4baef0" opacity="0.55"/>
    <rect x="84.5" y="26" width="3.5" height="16" rx="1.75" fill="#4baef0" opacity="0.45"/>
  </g>
  <!-- Case delantera -->
  <g transform="translate(20, 20)">
    <rect x="8" y="17" width="56" height="78" rx="13" fill="white" stroke="#1565c0" stroke-width="3.5"/>
    <rect x="23" y="21" width="18" height="4.5" rx="2.25" fill="#1565c0" opacity="0.65"/>
    <rect x="4.5" y="37" width="3.5" height="12" rx="1.75" fill="#1565c0" opacity="0.65"/>
    <rect x="4.5" y="52" width="3.5" height="12" rx="1.75" fill="#1565c0" opacity="0.65"/>
    <rect x="64.5" y="40" width="3.5" height="18" rx="1.75" fill="#1565c0" opacity="0.55"/>
    <text x="36" y="72" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" fill="#1565c0" text-anchor="middle" dominant-baseline="middle" letter-spacing="-1">CH</text>
  </g>
  <!-- Wordmark -->
  <text x="122" y="72" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" fill="#1565c0" dominant-baseline="middle" letter-spacing="2">CHARIS</text>
  <text x="124" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#4baef0" letter-spacing="4">DISTRIBUIDOR MAYORISTA</text>

  <!-- ══ SEPARADOR ══ -->
  <line x1="20" y1="135" x2="460" y2="135" stroke="#e2eaf4" stroke-width="1"/>
  <text x="20" y="150" font-family="Arial, sans-serif" font-size="9" fill="#aaa" letter-spacing="2">VARIANTES</text>

  <!-- Isotipo solo -->
  <g transform="translate(20, 155)">
    <rect x="16" y="0" width="36" height="48" rx="8" fill="none" stroke="#4baef0" stroke-width="2.5"/>
    <rect x="5" y="10" width="36" height="48" rx="8" fill="white" stroke="#1565c0" stroke-width="2.5"/>
    <text x="23" y="40" font-family="Arial Black, sans-serif" font-size="15" font-weight="900" fill="#1565c0" text-anchor="middle" dominant-baseline="middle" letter-spacing="-0.5">CH</text>
  </g>

  <!-- Variante oscura -->
  <rect x="80" y="152" width="120" height="42" rx="8" fill="#0d2137"/>
  <g transform="translate(88, 155)">
    <rect x="16" y="0" width="36" height="48" rx="8" fill="none" stroke="#4baef0" stroke-width="2.5"/>
    <rect x="5" y="10" width="36" height="48" rx="8" fill="#0d2137" stroke="#4baef0" stroke-width="2.5"/>
    <text x="23" y="40" font-family="Arial Black, sans-serif" font-size="15" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="-0.5">CH</text>
  </g>
  <text x="136" y="173" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" fill="white" dominant-baseline="middle" letter-spacing="1">CHARIS</text>
  <text x="136" y="188" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#4baef0" letter-spacing="2">DIST. MAYORISTA</text>

  <!-- Variante monocromática -->
  <g transform="translate(218, 155)">
    <rect x="16" y="0" width="36" height="48" rx="8" fill="none" stroke="#333" stroke-width="2.5"/>
    <rect x="5" y="10" width="36" height="48" rx="8" fill="white" stroke="#111" stroke-width="2.5"/>
    <text x="23" y="40" font-family="Arial Black, sans-serif" font-size="15" font-weight="900" fill="#111" text-anchor="middle" dominant-baseline="middle" letter-spacing="-0.5">CH</text>
  </g>
  <text x="268" y="173" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" fill="#111" dominant-baseline="middle" letter-spacing="1">CHARIS</text>
  <text x="268" y="188" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#555" letter-spacing="2">DIST. MAYORISTA</text>

  <!-- Favicon cuadrado -->
  <rect x="390" y="152" width="46" height="46" rx="10" fill="#1565c0"/>
  <g transform="translate(394, 153)">
    <rect x="16" y="0" width="28" height="38" rx="6" fill="none" stroke="#4baef0" stroke-width="2"/>
    <rect x="5" y="8" width="28" height="38" rx="6" fill="#1565c0" stroke="white" stroke-width="2"/>
    <text x="19" y="31" font-family="Arial Black, sans-serif" font-size="12" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="-0.5">CH</text>
  </g>

  <!-- Favicon claro -->
  <rect x="444" y="152" width="46" height="46" rx="10" fill="white" stroke="#e2eaf4" stroke-width="1.5"/>
  <g transform="translate(448, 153)">
    <rect x="16" y="0" width="28" height="38" rx="6" fill="none" stroke="#4baef0" stroke-width="2"/>
    <rect x="5" y="8" width="28" height="38" rx="6" fill="white" stroke="#1565c0" stroke-width="2"/>
    <text x="19" y="31" font-family="Arial Black, sans-serif" font-size="12" font-weight="900" fill="#1565c0" text-anchor="middle" dominant-baseline="middle" letter-spacing="-0.5">CH</text>
  </g>
</svg>
