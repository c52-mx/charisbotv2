<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <rect width="40" height="40" rx="10" fill="url(#grad)"/>
  <!-- Phone outline -->
  <rect x="12" y="7" width="16" height="26" rx="3" stroke="white" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Case wrap highlight -->
  <rect x="10" y="9" width="20" height="22" rx="4" stroke="white" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Screen -->
  <rect x="14" y="11" width="12" height="16" rx="1.5" fill="white" opacity="0.15"/>
  <!-- C letter -->
  <text x="20" y="23" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle">C</text>
  <!-- Bottom dot -->
  <circle cx="20" cy="30" r="1.5" fill="white" opacity="0.6"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a8fe3"/>
      <stop offset="100%" stop-color="#0d5fa3"/>
    </linearGradient>
  </defs>
</svg>